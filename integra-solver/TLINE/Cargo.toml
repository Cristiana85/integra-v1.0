[package]
name = "integra_solver_wasm"
version = "0.1.0"
edition = "2021"
authors = [""]
description = ""
license = ""

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-logger = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3.34"

[profile.release]
lto = true
opt-level = "s"

[features]
wasm = []

[[bin]]
name = "tline-cli"
path = "src/main.rs"
