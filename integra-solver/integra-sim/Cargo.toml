[package]
name = "integra-sim"
version = "0.1.0"
edition = "2021"
authors = ["Max"]
description = "Simulatore di parametri S ad alte prestazioni via WebGPU + WASM"
license = "TBD"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "1.15", features = ["derive"] }
futures-intrusive = "0.5"
wgpu = "0.20"
pollster = "0.3"
ndarray = { version = "0.15", features = ["serde"] }
wasm-bindgen = "0.2.84"
cfg-if = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.5"
serde_json = "1.0"
num-complex = { version = "0.4", features = ["serde"] }
nalgebra = { version = "0.32", features = ["serde"] }
js-sys = "0.3"
log = "0.4"
env_logger = "0.11"
wasm-logger = "0.2"
web-sys = { version = "0.3", features = ["console", "Window"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
console_error_panic_hook = { version = "0.1.7", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3.34"

[profile.release]
lto = true
opt-level = "s"

[features]
default = ["web"]
web = ["console_error_panic_hook"]
native = []

[[bin]]
name = "integra-sim-cli"
path = "src/main.rs"