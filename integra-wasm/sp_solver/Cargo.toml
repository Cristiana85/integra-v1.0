[package]
name = "sp_solver_wasm"
version = "0.1.0"
edition = "2021"

[lib]
name = "sp_solver_wasm"  # The library target (for WebAssembly)
crate-type = ["cdylib", "rlib"]  # Required for WebAssembly (cdylib) and Rust library (rlib)

[dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.5"
serde = { version = "1.0", features = ["derive"] }  # Serialization support
serde_json = "1.0"  # JSON parsing for input/output
thiserror = "1.0"  # For custom error handling
nalgebra = "0.32"  # For matrix calculations in S-parameter analysis
log = "0.4"  # Logging framework
console_error_panic_hook = "0.1"  # Better panic messages in WASM

[dev-dependencies]
wasm-bindgen-test = "0.3"  # Unit testing for WebAssembly

[features]
default = []  # Default feature set
wasm = []  # Enable WebAssembly-specific features

[profile.release]
lto = true  # Link Time Optimization for smaller WASM size
opt-level = "s"  # Optimize for size

[[bin]]
name = "sp_solver_exe"  # Rename the binary target to avoid filename conflict
path = "src/main.rs"
