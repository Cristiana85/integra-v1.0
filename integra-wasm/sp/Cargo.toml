[package]
name = "sp_solver_wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []  # Default feature set
wasm = []  # Enable WebAssembly-specific features

[dependencies]
wasm-bindgen = "0.2.84"
cfg-if = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.5"
serde_json = "1.0"
nalgebra = { version = "0.32", features = ["serde"] }  # ✅ `serde` attivato!
js-sys = "0.3"        # ✅ Aggiungi js-sys separatamente
log = "0.4"
env_logger = "0.11"
wasm-logger = "0.2"
web-sys = { version = "0.3", features = ["console", "Window"] }

thiserror = "1.0"  # For custom error handling

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.7", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3.34"

[profile.release]
lto = true
# Tell `rustc` to optimize for small code size.
opt-level = "s"

[[bin]]
name = "sp_solver_exe" 
path = "src/main.rs"
