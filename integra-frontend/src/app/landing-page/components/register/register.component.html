<div class="center-container">
  <div class="surface-card p-4 shadow-2 border-round w-full lg:w-6">
    <div class="text-center mb-5">
      <img src="assets/images/blocks/logos/hyper.svg" alt="Image" height="50" class="mb-3">
      <div class="text-900 text-3xl font-medium mb-3">Welcome Back</div>
      <span class="text-600 font-medium line-height-3">Have already an account?</span>
      <a class="font-medium no-underline ml-2 text-blue-500 cursor-pointer" [routerLink]="'/login'">Sign In!</a>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="registerUser()">
      <label for="name" class="block text-900 font-medium mb-2">Name</label>
      <input id="name" type="string" placeholder="Name" pInputText class="w-full mb-3" formControlName="name"
        name="name" />

      <label for="surname" class="block text-900 font-medium mb-2">Surname</label>
      <input id="surname" type="string" placeholder="Surname" pInputText class="w-full mb-3" formControlName="surname"
        name="surname" />

      <label for="email1" class="block text-900 font-medium mb-2">Email</label>
      <input id="email1" type="email" placeholder="Email address" pInputText class="w-full mb-3" formControlName="email"
        name="email" />

      <label for="password1" class="block text-900 font-medium mb-2">Password</label>
      <input id="password1" type="password" placeholder="Password" pInputText class="w-full mb-3"
        formControlName="password1" name="password1" />

      <label for="password2" class="block text-900 font-medium mb-2">Password</label>
      <input id="password2" type="password" placeholder="Confirm Password" pInputText class="w-full mb-3"
        formControlName="password2" name="password2" [ngClass]="{
          'border-red': (passwordsMismatch || registerForm.get('password2')?.invalid) && registerForm.get('password2')?.touched
        }" />

      <!--<div class="flex align-items-center justify-content-between mb-6">
        <div class="flex align-items-center">
          <p-checkbox id="rememberme1" [binary]="true" styleClass="mr-2"></p-checkbox>
          <label for="rememberme1">Remember me</label>
        </div>
        <a class="font-medium no-underline ml-2 text-blue-500 text-right cursor-pointer"
          (click)="onForgotPasswordClick()">Forgot password?</a>
      </div>-->

      <button pButton pRipple label="Sign In" icon="pi pi-user" class="w-full"></button>
    </form>
  </div>
</div>
