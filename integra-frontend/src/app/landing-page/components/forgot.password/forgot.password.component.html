<div class="center-container">
  <div class="surface-card p-4 shadow-2 border-round w-full lg:w-6">
    <div class="text-center mb-5">
      <img src="assets/images/blocks/logos/hyper.svg" alt="Image" height="50" class="mb-3">
      <div class="text-900 text-3xl font-medium mb-3">Welcome Back</div>
      <span class="text-600 font-medium line-height-3">Don't have an account?</span>
      <a class="font-medium no-underline ml-2 text-blue-500 cursor-pointer" [routerLink]="'/login'">Create today!</a>
    </div>

    <form [formGroup]="forgotPasswordForm" (ngSubmit)="forgotPassword()">
      <label for="email1" class="block text-900 font-medium mb-2">Email</label>
      <input id="email1" type="email" placeholder="Email address" pInputText class="w-full mb-3" formControlName="email"
        name="email" />
      <button pButton pRipple label="Continue" icon="pi pi-user" class="w-full"></button>
    </form>
  </div>
</div>
