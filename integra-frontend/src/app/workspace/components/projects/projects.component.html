<div class="surface-ground">
  <div class="grid">
    <div class="col-12 md:col-6 xl:col-3 p-3" *ngFor="let project of lProject">
      <div class="surface-card shadow-2 border-round p-3" style="border-radius: 6px">
        <div class="flex justify-content-between align-items-start">
          <!-- Dettagli progetto -->
          <div>
            <div class="text-xl font-medium text-900 mb-2">{{ project.name }}</div>
            <p class="mt-0 mb-3 text-600">{{ project.name }}</p>
          </div>

          <!-- Contenitore pulsanti -->
          <div class="flex align-items-center">
            <button pButton pRipple icon="pi pi-download" class="p-button-rounded p-button-text mr-2">
            </button>
            <button pButton pRipple icon="pi pi-folder-open" class="p-button-rounded p-button-text"
              (click)="openProject(project.name)">
            </button>
          </div>
        </div>

        <!-- Dettagli aggiuntivi -->
        <ul class="list-none m-0 p-0">
          <li class="px-0 py-2 flex justify-content-between align-items-center border-bottom-1 surface-border">
            <span class="text-600 font-medium text-sm">Name</span>
            <span class="text-900 font-medium text-sm">{{ project.name }}</span>
          </li>
          <li class="px-0 py-2 flex justify-content-between align-items-center border-bottom-1 surface-border">
            <span class="text-600 font-medium text-sm">Creation date</span>
            <span class="text-900 font-medium text-sm">{{ project.creationDate }}</span>
          </li>
          <li class="px-0 py-2 flex justify-content-between align-items-center">
            <span class="text-600 font-medium text-sm">Editing date</span>
            <span class="text-900 font-medium text-sm">{{ project.editingDate }}</span>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
