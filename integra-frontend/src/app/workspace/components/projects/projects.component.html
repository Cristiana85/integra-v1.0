<section class="surface-section px-1 py-1 md:px-6 lg:px-4">
  <div class="flex flex-wrap gap-3 justify-content-between align-items-center">
    <div class="flex flex-column gap-2">
      <h1 class="m-0 text-900 text-3xl font-medium line-height-3">All Files</h1>
    </div>
    <div class="flex flex-wrap align-items-center gap-3">
      <button pButton pRipple label="Upgrade to Pro" class="p-button-text"></button>
      <button pButton pRipple label="Save Changes"></button>
      <button pButton pRipple icon="pi pi-ellipsis-v" class="p-button-outlined"></button>

      <p-divider layout="vertical"></p-divider>

      <button pButton pRipple icon="pi pi-plus" class="p-button-text mr-2" (click)="openPopup()"></button>
      <button pButton pRipple icon="pi pi-external-link" class="p-button-text mr-2"></button>
      <button pButton pRipple icon="pi pi-folder-open" class="p-button-text mr-2"></button>

      <p-divider layout="vertical"></p-divider>

      <div class="view-toggle flex ml-3">
        <button pButton pRipple icon="pi pi-th-large" class="p-button-text mr-2"></button>
        <button pButton pRipple icon="pi pi-list" class="p-button-text"></button>
      </div>
    </div>
  </div>
  <div class="mt-5">
    <ul class="flex align-items-center overflow-x-auto gap-3 px-2 py-3 list-none border-bottom-1 surface-border">
      <li><button pButton pRipple icon="pi pi-user" (click)="activeTabAction = 'myProjects'" label="My Projects"
          [ngClass]="{'p-button-text text-700': activeTabAction !== 'profile'}"></button></li>
      <li><button pButton pRipple icon="pi pi-globe" (click)="activeTabAction = 'collaborateProjects'"
          label="Collaborate with me" [ngClass]="{'p-button-text text-700': activeTabAction != 'website'}"></button>
      </li>
      <li><button pButton pRipple icon="pi pi-shield" (click)="activeTabAction = 'shareProjects'" label="My Shares"
          [ngClass]="{'p-button-text text-700': activeTabAction != 'privacy'}"></button></li>
    </ul>
  </div>
  <div class="grid">
    <div class="col-12 md:col-6 xl:col-3 p-3" *ngFor="let project of filteredProjects">
      <div class="surface-card shadow-2 border-round p-3 card-container">
        <!-- Immagine con effetto hover -->
        <div class="image-container">
          <img src="assets/images/blocks/nature/nature-1.png" class="mb-3 w-full project-image" />
          <!-- Puntini sopra l'immagine -->
          <div class="ellipsis-menu" (click)="menu.toggle($event)">
            <i class="pi pi-ellipsis-h"></i>
          </div>
          <!--<img [src]="project.image || 'https://via.placeholder.com/200x100.png?text=Project+Image'"
            alt="{{ project.name }}" class="project-image" />-->
          <p-overlayPanel #menu [dismissable]="true">
            <ul class="list-none p-0 m-0 menu-list">
              <li class="menu-item" (click)="onMenuItemClick('open', project, menu)">
                <i class="pi pi-folder-open mr-2"></i> Open Project
              </li>
              <li class="menu-item" (click)="onMenuItemClick('openInNewTab', project, menu)">
                <i class="pi pi-external-link mr-2"></i> Open in New Tab
              </li>
              <p-divider></p-divider>
              <li class="menu-item" (click)="inviteToCollaborate(project)">
                <i class="pi pi-users mr-2"></i> Invite to Collaborate
              </li>
              <li class="menu-item" (click)="makeCopy(project)">
                <i class="pi pi-copy mr-2"></i> Make a Copy
              </li>
              <p-divider></p-divider>
              <li class="menu-item" (click)="delete(project)">
                <i class="pi pi-trash mr-2"></i> Delete
              </li>
            </ul>
          </p-overlayPanel>
        </div>

        <!-- Dettagli del progetto -->
        <div class="flex flex-column align-items-center justify-content-center mt-3">
          <div>
            <div class="text-xl font-medium text-900 mb-2">{{ project.name }}</div>
            <p class="mt-0 mb-3 text-600">{{ project.size }}</p>
          </div>
        </div>
        <ul class="list-none m-0 p-0">
          <li class="px-0 py-2 flex justify-content-between align-items-center border-bottom-1 surface-border">
            <span class="text-600 font-medium text-sm">Created</span>
            <span class="text-900 font-medium text-sm">{{ project.created }}</span>
          </li>
          <li class="px-0 py-2 flex justify-content-between align-items-center border-bottom-1 surface-border">
            <span class="text-600 font-medium text-sm">Dimensions</span>
            <span class="text-900 font-medium text-sm">{{ project.dimensions }}</span>
          </li>
          <li class="px-0 py-2 flex justify-content-between align-items-center">
            <span class="text-600 font-medium text-sm">Resolution</span>
            <span class="text-900 font-medium text-sm">{{ project.resolution }}</span>
          </li>
        </ul>
      </div>
    </div>
  </div>
</section>

<integra-add-projects *ngIf="visiblePopUp" [visible]="visiblePopUp" [project]="projectEmpty"
  (create)="createProject($event)" (close)="closePopup()"></integra-add-projects>
