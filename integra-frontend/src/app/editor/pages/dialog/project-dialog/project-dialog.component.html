<!-- PrimeNG Dialog -->
<p-dialog
  header="Edit project details"
  [(visible)]="displayDialog"
  [modal]="true"
  [closable]="true"
  [style]="{ width: '450px' }"
>
  <!-- Name Field -->
  <div class="p-field">
    <label for="name">Name</label>
    <input pInputText id="name" [(ngModel)]="projectName" disabled />
  </div>

  <!-- Description Field -->
  <div class="p-field">
    <label for="description">Description</label>
    <textarea
      pInputTextarea
      id="description"
      rows="2"
      [(ngModel)]="projectDescription"
      placeholder="A brief description of my project"
    ></textarea>
  </div>

  <!-- Privacy Options -->
  <div class="p-field">
    <label>Privacy</label>
    <div class="p-mb-2">
      <p-radioButton
        name="privacy"
        value="public"
        [(ngModel)]="privacy"
        inputId="public"
      ></p-radioButton>
      <label for="public" class="privacy-label">
        <i class="pi pi-users"></i> Public to organization
      </label>
    </div>
    <div>
      <p-radioButton
        name="privacy"
        value="private"
        [(ngModel)]="privacy"
        inputId="private"
      ></p-radioButton>
      <label for="private" class="privacy-label">
        <i class="pi pi-lock"></i> Private to me
      </label>
    </div>
  </div>

  <!-- Use Project as Template -->
  <div class="p-field">
    <p-inputSwitch [(ngModel)]="useTemplate"></p-inputSwitch>
    <label class="p-ml-2">Use project as template</label>
    <p class="p-text-muted p-mt-1">Turn on to make the project a template. <a href="#">Learn more.</a></p>
  </div>

  <!-- Footer with Save Changes Button -->
  <p-footer>
    <button
      pButton
      type="button"
      label="Save Changes"
      icon="pi pi-check"
      class="p-button-primary"
      (click)="closeDialog()"
    ></button>
  </p-footer>
</p-dialog>
