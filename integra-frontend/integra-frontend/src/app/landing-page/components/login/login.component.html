<div class="login-page p-d-flex p-jc-center p-ai-center p-min-vh-100 p-px-3">
  <div class="login-container p-d-flex p-flex-column p-md-flex-row p-shadow-3 p-rounded p-p-4 p-bg-white">
    <!-- Right Section: Login Form -->
    <div class="form-section p-d-flex p-flex-column p-flex-1">
      <h3 class="p-text-center p-mb-3">Login</h3>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="p-fluid">
        <!-- Email Field -->
        <div class="p-field">
          <label for="email">Your Email *</label>
          <div class="p-inputgroup">
            <span class="p-inputgroup-addon">
              <i class="pi pi-user"></i>
            </span>
            <input id="email" type="email" formControlName="email" pInputText
              [ngClass]="{ 'p-invalid': isSubmitted && f['email'].invalid }" />
          </div>
          <small *ngIf="isSubmitted && f['email'].hasError('required')" class="p-error">
            Email is required.
          </small>
          <small *ngIf="isSubmitted && f['email'].hasError('email')" class="p-error">
            Invalid email format.
          </small>
        </div>

        <!-- Password Field -->
        <div class="p-field">
          <label for="password">Password *</label>
          <div class="p-inputgroup">
            <span class="p-inputgroup-addon">
              <i class="pi pi-lock"></i>
            </span>
            <input id="password" type="password" formControlName="password" pPassword
              [ngClass]="{ 'p-invalid': isSubmitted && f['password'].invalid }" />
          </div>
          <small *ngIf="isSubmitted && f['password'].hasError('required')" class="p-error">
            Password is required.
          </small>
          <small *ngIf="isSubmitted && f['password'].hasError('minlength')" class="p-error">
            Password must be at least 6 characters long.
          </small>
        </div>

        <!-- Remember Me and Forgot Password -->
        <div class="p-d-flex p-jc-between p-ai-center p-mb-3">
          <div>
            <p-checkbox inputId="remember" binary="true"></p-checkbox>
            <label for="remember" class="p-ml-2">Remember me</label>
          </div>
          <a href="#" class="forgot-password-link">Forgot password?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" pButton label="Sign in" class="p-button-primary p-mb-3"></button>

        <!-- Social Login -->
        <div class="p-text-center p-mb-3">Or Login With</div>
        <div class="p-d-flex p-jc-center p-mb-3">
          <button type="button" pButton label="Facebook" icon="pi pi-facebook"
            class="p-button-outlined p-button-info p-mr-2"></button>
          <button type="button" pButton label="Google" icon="pi pi-google"
            class="p-button-outlined p-button-danger"></button>
        </div>
      </form>

      <!-- Sign Up Link -->
      <div class="p-text-center">
        <p>Don't have an account? <a href="#" class="register-link">Sign Up</a></p>
      </div>
    </div>
  </div>
</div>
