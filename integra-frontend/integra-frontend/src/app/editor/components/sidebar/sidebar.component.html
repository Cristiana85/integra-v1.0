<div class="sidebar">
  <!-- Search Bar -->
  <div class="search-bar">
    <input type="text" placeholder="Search" [(ngModel)]="searchText" (input)="filterItems()" />
  </div>

  <!-- Sections -->
  <div *ngFor="let section of filteredSections" class="section">
    <!-- Section Header -->
    <div class="section-header" (click)="toggleSection(section)">
      <i class="pi" [ngClass]="section.collapsed ? 'pi-angle-right' : 'pi-angle-down'"></i>
      {{ section.label }}
    </div>

    <!-- Section Items -->
    <div class="section-items" *ngIf="!section.collapsed">
      <div *ngFor="let item of section.items" class="draggable-item" draggable="true"
        (dragstart)="onDragStart($event, item)">
        <i class="{{ item.icon }}"></i> {{ item.label }}
      </div>
    </div>
  </div>
</div>
