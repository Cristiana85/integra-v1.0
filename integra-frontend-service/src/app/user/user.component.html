<div class="user-page">
  <div class="user-card">
    <div class="user-header">
      <div class="user-avatar">
        <span>
          {{ user?.name?.[0] || user?.email?.[0] || 'U' | uppercase }}
        </span>
      </div>
      <div class="user-info">
        <h2>
          {{ user?.name || "Utente" }}
          {{ user?.surname || "" }}
        </h2>
        <p class="user-email">
          {{ user?.email || "email non disponibile" }}
        </p>
      </div>
    </div>

    <div class="user-meta">
      <div class="user-meta-item">
        <span class="label">Workspace salvati</span>
        <span class="value">{{ workspaceCount }}</span>
      </div>

      <div class="user-meta-item">
        <span class="label">Ambiente</span>
        <span class="value">Integra v1 – GPU</span>
      </div>
    </div>

    <div class="user-actions">
      <button
        class="integra-btn integra-btn-ghost"
        routerLink="/workspace"
        type="button"
      >
        Vai ai workspace
      </button>

      <button
        class="integra-btn integra-btn-ghost"
        routerLink="/"
        type="button"
      >
        Torna alla home
      </button>
    </div>
  </div>
</div>
