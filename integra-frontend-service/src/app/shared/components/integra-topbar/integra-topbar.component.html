<header class="topbar">
  <div class="topbar-inner">
    <!-- LEFT -->
    <div class="topbar-left">
      <a routerLink="/" class="topbar-brand">
        <span class="topbar-logo">✏️</span>
        <span class="topbar-title">IntegraDraw</span>
      </a>

      <nav class="topbar-nav" aria-label="Main navigation">
        <button
          type="button"
          class="topbar-link-btn"
          (click)="scrollToSection('hero')"
        >
          Home
        </button>
        <button
          type="button"
          class="topbar-link-btn"
          (click)="scrollToSection('features')"
        >
          Features
        </button>
        <button
          type="button"
          class="topbar-link-btn"
          (click)="scrollToSection('roadmap')"
        >
          Roadmap
        </button>

        <a
          routerLink="/pricing"
          class="topbar-link-btn"
          routerLinkActive="topbar-link-btn--active"
        >
          Pricing
        </a>
      </nav>
    </div>

    <!-- RIGHT -->
    <div class="topbar-right">
      <!-- THEME TOGGLE -->
      <button
        type="button"
        class="topbar-theme-btn"
        (click)="toggleTheme()"
        [attr.aria-label]="
          isLight ? 'Passa al tema scuro' : 'Passa al tema chiaro'
        "
      >
        <i class="pi" [ngClass]="isLight ? 'pi-moon' : 'pi-sun'"></i>
      </button>

      <!-- AUTH DESKTOP -->
      <div class="topbar-auth">
        <button type="button" class="topbar-auth-ghost" routerLink="/login">
          Sign in
        </button>

        <button
          type="button"
          class="topbar-auth-primary"
          routerLink="/register"
        >
          Create workspace
        </button>
      </div>

      <!-- BURGER MOBILE -->
      <button
        type="button"
        class="topbar-menu-toggle"
        [ngClass]="{ 'topbar-menu-toggle--active': mobileMenuOpen }"
        (click)="toggleMobileMenu()"
        aria-label="Toggle navigation"
      >
        <i
          class="pi topbar-menu-toggle-icon"
          [ngClass]="mobileMenuOpen ? 'pi-times' : 'pi-bars'"
        ></i>
      </button>
    </div>
  </div>

  <!-- MENU MOBILE -->
  <div class="topbar-mobile-menu" *ngIf="mobileMenuOpen">
    <nav class="topbar-mobile-nav">
      <button type="button" (click)="goToSectionAndClose('hero')">
        <i class="pi pi-home"></i>
        <span>Home</span>
      </button>

      <button type="button" (click)="goToSectionAndClose('features')">
        <i class="pi pi-sparkles"></i>
        <span>Features</span>
      </button>

      <button type="button" (click)="goToSectionAndClose('roadmap')">
        <i class="pi pi-compass"></i>
        <span>Roadmap</span>
      </button>

      <a
        class="topbar-mobile-link"
        routerLink="/pricing"
        (click)="closeMobileMenu()"
      >
        <i class="pi pi-credit-card"></i>
        <span>Pricing</span>
      </a>

      <hr class="topbar-mobile-divider" />

      <button
        type="button"
        class="topbar-mobile-auth-btn"
        routerLink="/login"
        (click)="closeMobileMenu()"
      >
        <i class="pi pi-sign-in"></i>
        <span>Sign in</span>
      </button>

      <button
        type="button"
        class="topbar-mobile-auth-btn topbar-mobile-auth-btn--primary"
        routerLink="/register"
        (click)="closeMobileMenu()"
      >
        <i class="pi pi-user-plus"></i>
        <span>Create workspace</span>
      </button>
    </nav>
  </div>
</header>
