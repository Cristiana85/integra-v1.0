<div class="sidebar">
  <!-- Layout Section -->
  <div class="section">
    <h4>Layout</h4>
    <div class="layout-icons">
      <div
        *ngFor="let layout of layouts"
        [ngClass]="{ 'selected': layout.id === selectedLayout }"
        class="layout-icon"
        (click)="selectLayout(layout.id)"
      >
        <i [class]="layout.icon"></i>
      </div>
    </div>
  </div>

  <!-- Theme Style Section -->
  <div class="section">
    <h4>Theme Style</h4>
    <div class="theme-grid">
      <div
        *ngFor="let theme of themes"
        class="theme-card"
        [ngClass]="{ 'selected': theme.id === selectedTheme }"
        (click)="selectTheme(theme.id)"
      >
        <img [src]="theme.image || 'assets/icons/placeholder.jpg'" alt="{{ theme.label }}" />
        <span *ngIf="theme.isPro" class="badge">PRO</span>
      </div>
    </div>
  </div>
</div>
